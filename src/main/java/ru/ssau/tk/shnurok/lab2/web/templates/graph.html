<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <script th:src="@{/js/scripts.js}" type="text/javascript"></script>
    <script th:src="@{/js/graphScript.js}" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>График</title>

    <style>
        body {
            font-family: 'TT Commons', sans-serif;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 10px;
            padding: 10px;
        }

        #flis {
            background-color: #e0f7fa; /* Светло-голубой */
            border-radius: 25px;
            padding: 5px;
            height: 100%;
            min-height: 94vh;
            text-align: center;
        }

        #flisTitle {
            font-weight: bold;
            font-size: 27px;
            margin-bottom: 30px;
            margin-top: 50px;
        }

        #flis button {
            background-color: #00bcd4; /* Голубой */
            color: white;
            border: none;
            border-radius: 25px;
            margin-bottom: 10px;
            width: 35%;
            height: 45px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        #flis button:hover {
            background-color: #00acc1; /* Более темный голубой при наведении */
        }

        #flis button[disabled] {
            background-color: #b5c197; /* Серый фон для заблокированной кнопки */
            color: #ffffff;
            cursor: not-allowed;
            opacity: 0.6;
        }

        #flis table {
            width: 55%;
            border-spacing: 0;
            margin: 0 auto;
            border: none;
        }

        #flis th, td {
            padding: 10px;
            text-align: center;
            border: 1px solid #e0e0e0;
        }

        #flis th {
            background-color: #d1c4e9; /* Сиреневый фон заголовка таблицы */
            color: white;
            font-weight: bold;
        }

        #flis tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        #flis tr:nth-child(odd) {
            background-color: #fff;
        }

        #flis table tr:hover {
            background-color: #96fbfb; /* Легкий голубой при наведении */
        }

        #glamur {
            background-color: #e0f7fa; /* Светло-голубой */
            border-radius: 25px;
            padding: 5px;
            height: 100%;
            min-height: 94vh;
            text-align: center;
        }

        #glamurTitle {
            font-weight: bold;
            font-size: 27px;
            margin-bottom: 30px;
            margin-top: 50px;
        }

        #xToApply {
            width: 55%;
            height: 45px;
            border: none;
            border-radius: 25px;
            background-color: white;
            font-size: 15px;
            padding-left: 20px;
            padding-right: 15px;
            outline: none;
            margin-bottom: 10px;
        }

        #glamur button {
            background-color: #00bcd4; /* Голубой */
            color: #2e2e2e;
            border: none;
            border-radius: 25px;
            margin-bottom: 10px;
            width: 130px;
            height: 45px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        #glamur button:hover {
            background-color: #00acc1; /* Более темный голубой при наведении */
        }

        #glamur button[disabled] {
            background-color: #c5d3a3; /* Серый фон для заблокированной кнопки */
            color: #858585;
            cursor: not-allowed;
            opacity: 0.6;
        }
    </style>
</head>
<body>
<div class="container">
    <div id="flis">
        <h3 id="flisTitle">Функция</h3>
        <button onclick="openModal('graph','graph')">Создать функцию</button>
        <button onclick="openSave('graph')" th:attr="disabled=${graphFunc == null}">Сохранить</button>
        <button onclick="openFunctionList('graph')">Загрузить</button>
        <button onclick="openAnother('graph','graph')">Создать (интервал)</button>
        <button onclick="openEdit('graph','graph')" th:attr="disabled=${graphFunc == null}">Вставить или изменить</button>
        <button onclick="openRemove('graph','graph')" th:attr="disabled=${graphFunc == null or countGraph == 2 }">Удалить точку</button>
        <div id="graphContent">
            <div th:if="${graphFunc != null}">
                <h4>Таблица функции:</h4>
                <table border="1">
                    <thead>
                    <tr>
                        <th>X</th>
                        <th>Y</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="i : ${#numbers.sequence(0, countGraph - 1)}">
                        <td><input type="number" th:value="${graphFunc.getXValues()[i]}" readonly></td>
                        <td><input type="number" th:value="${graphFunc.getYValues()[i]}" readonly></td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div th:if="${graphFunc == null}">
                <p>Отсутствует функция</p>
            </div>
        </div>
    </div>
    <div id="glamur">
        <h3 id="glamurTitle">График</h3>
        <form action="/graph/apply" method="post">
            <input type="number" id="xToApply" placeholder="Введите Х" name="xToApply" required>
            <button type="submit" th:attr="disabled=${graphFunc == null}">Выполнить</button>
        </form>

        <div th:if="${graphResult != null}">
            <p th:text="${graphResult}"></p>
        </div>
        <div th:if="${graphResult == null}">
            <p>Нет результата</p>
        </div>
        <div id="functionGraphContainer">
            <canvas id="functionGraph"></canvas>
        </div>
    </div>
</div>
<div th:replace="fragments/functionsModalForms"></div>
</body>
</html>
