<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Табулированные функции</title>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: 'TT Commons', sans-serif;
            background: #f0f0f0;
        }
        #modalCreate {
            background: #2e2e2e;
            padding: 20px;
            border-radius: 15px;
            color: #ffffff;
        }
        #title {
            font-weight: bold;
            font-size: 24px;
            color: #d9ff6b;
            text-align: center;
        }
        #factoryType {
            font-size: 14px;
            margin-bottom: 5px;
            font-weight: bold;
        }
        #points {
            background-color: #e0f7fa; /* Light cyan */
            border: none;
            border-radius: 25px;
            padding-left: 15px;
            font-size: 16px;
            color: #252525;
            width: 380px;
            height: 35px;
            margin-top: 10px;
            margin-bottom: 15px;
        }
        #generateTable {
            border: none;
            border-radius: 25px;
            float: left;
            margin-top: 5px;
            font-size: 14px;
            background-color: #00bcd4; /* Cyan */
            color: #ffffff;
            font-weight: bold;
            width: 220px;
            height: 35px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        #generateTable:hover {
            background-color: #0097a7; /* Darker cyan */
        }
    </style>
</head>
<body>
<div id="modalCreate">
    <div><h1 id="title">Создание функции</h1></div>
    <div>
        <p th:utext="'Текущая фабрика: <br>' + ${factory}" id="factoryType"></p>
    </div>
    <div>
        <form onsubmit="submitForm(event)">
            <input type="hidden" name="target" th:value="${target}">
            <input type="hidden" name="redirectTarget" th:value="${redirectTarget}">
            <label for="points"></label>
            <input type="number" placeholder="Количество точек" name="points" id="points" min="2" required>
            <button type="submit" id="generateTable">Сгенерировать таблицу</button>
        </form>
        <button id="closeButtomCreateFunction" type="button" onclick="closeModal()">Закрыть</button>
    </div>
</div>
</body>
</html>
