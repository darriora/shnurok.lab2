<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <script th:src="@{/js/scripts.js}" type="text/javascript"></script>
    <title>Дифференцирование</title>
    <style>
        body {
            font-family: 'TT Commons', sans-serif;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding: 10px;
        }

        #fikus {
            background-color: #b7f4fb; /* Светло-голубой */
            border-radius: 25px;
            padding: 5px;
            height: 100%;
            min-height: 94vh;
            text-align: center;
        }

        #fikusTitle {
            font-weight: bold;
            font-size: 27px;
            margin-bottom: 30px;
            margin-top: 50px;
        }

        #fikus button {
            background-color: #00bcd4; /* Голубой */
            color: #2e2e2e;
            border: none;
            border-radius: 25px;
            margin-bottom: 10px;
            width: 55%;
            height: 45px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        #fikus button:hover {
            background-color: #00acc1; /* Более насыщенный голубой при наведении */
        }

        #fikus button[disabled] {
            background-color: #c5d3a3;
            color: #ededed;
            cursor: not-allowed;
            opacity: 0.6;
        }

        #romashka {
            background-color: #d1c4e9; /* Сиреневый */
            border-radius: 25px;
            padding: 5px;
            height: 100%;
            min-height: 94vh;
            text-align: center;
        }

        #romashkaTitle {
            font-weight: bold;
            font-size: 27px;
            margin-bottom: 30px;
            margin-top: 50px;
        }

        #romashka button {
            background-color: #66faff; /* Светло-голубой */
            color: white;
            border: none;
            border-radius: 25px;
            margin-bottom: 10px;
            width: 55%;
            height: 45px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        #romashka button:hover {
            background-color: #00acc1; /* Более насыщенный голубой при наведении */
        }

        #fikus table, #romashka table {
            width: 55%;
            border-spacing: 0;
            margin: auto;
            border: none;
        }

        #fikus th, #fikus td, #romashka th, #romashka td {
            padding: 10px;
            text-align: center;
            border: 1px solid #e0e0e0;
        }

        #fikus th, #romashka th {
            background-color: #00bcd4; /* Голубой фон заголовка таблицы */
            color: white;
            font-weight: bold;
        }

        #fikus tr:nth-child(even), #romashka tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        #fikus tr:nth-child(odd), #romashka tr:nth-child(odd) {
            background-color: #fff;
        }

        #fikus table tr:hover, #romashka table tr:hover {
            background-color: #a1edff; /* Легкий голубой при наведении */
        }
    </style>
</head>
<body>
<div class="container">
    <div id="fikus">
        <h3 id="fikusTitle">Функция</h3>
        <button onclick="openModal('diff','differential-operation')">Создать функцию</button>
        <button onclick="openSave('diff')" th:attr="disabled=${diffFunc == null}">Сохранить</button>
        <button onclick="openFunctionList('diff')">Загрузить</button>
        <button onclick="openAnother('differential-operation','diff')">Создать (интервал)</button>
        <button onclick="openEdit('diff','differential-operation')" th:attr="disabled=${diffFunc == null}">Вставить или изменить</button>
        <button onclick="openRemove('diff','differential-operation')" th:attr="disabled=${diffFunc == null or countOfDiff == 2 }">Удалить точку</button>
        <div>
            <div th:if="${diffFunc != null}">
                <h4>Таблица функции:</h4>
                <table border="1">
                    <thead>
                    <tr>
                        <th>X</th>
                        <th>Y</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="i : ${#numbers.sequence(0, countOfDiff - 1)}">
                        <td><input type="number" th:value="${diffFunction.getXValues()[i]}" readonly></td>
                        <td><input type="number" th:value="${diffFunction.getYValues()[i]}" readonly></td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div th:if="${diffFunc == null}">
                <p>Отсутствует функция</p>
            </div>
        </div>
    </div>
    <div id="romashka">
        <h3 id="romashkaTitle">Результат</h3>
        <div>
            <form action="/differential-operation/doDiff" method="post">
                <button type="submit" th:attr="disabled=${diffFunc == null}">Выполнить</button>
            </form>
        </div>
        <button onclick="openSave('result')" th:attr="disabled=${resultDiffFunc == null}">Сохранить</button>
        <div th:if="${resultDiffFunc != null}">
            <h4>Таблица функции:</h4>
            <table border="1">
                <thead>
                <tr>
                    <th>X</th>
                    <th>Y</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="i : ${#numbers.sequence(0, countOfResultDiff - 1)}">
                    <td><input type="number" th:value="${resultDiffFunc.getXValues()[i]}" readonly></td>
                    <td><input type="number" th:value="${resultDiffFunc.getYValues()[i]}" readonly></td>
                </tr>
                </tbody>
            </table>
        </div>
        <div th:if="${resultDiffFunc == null}">
            <p>Отсутствует функция</p>
        </div>
    </div>
    <div th:replace="fragments/functionsModalForms"></div>
</div>
</body>
</html>
