<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: 'TT Commons', sans-serif;
        }
        .modalAnother {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #2e2e2e;
            border-radius: 30px;
            padding: 20px;
            display: none;
            z-index: 1001;
            width: 380px;
            height: 450px;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            z-index: 1000;
        }
        #modalSave, #modalEdit {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #2e2e2e;
            border: none;
            border-radius: 25px;
            width: 360px;
            color: #769be8;
            font-weight: bold;
            font-size: 24px;
            text-align: center;
            padding: 35px 20px;
            z-index: 1001;
        }
        #funcName, #xValue, #yValue, #xToRemove {
            width: 70%;
            height: 40px;
            margin-top: 20px;
            margin-bottom: 15px;
            border-radius: 25px;
            border: none;
            padding-left: 20px;
            background-color: #e0f7fa; /* Light cyan */
            color: #2e2e2e; /* Dark text */
            font-size: 15px;
            font-family: 'TT Commons', sans-serif;
        }
        #modalContentSave button, #modalEditContent button {
            width: 33%;
            height: 40px;
            border: none;
            border-radius: 25px;
            background-color: #00bcd4; /* Cyan */
            color: #ffffff;
            font-family: 'TT Commons', sans-serif;
            font-size: 15px;
            margin-bottom: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        #modalContentSave button:hover, #modalEditContent button:hover {
            background-color: #0097a7; /* Darker cyan */
        }
        #closeEdit, #clooose {
            background-color: #ffcccb; /* Light red */
            color: #ffffff;
            border: none;
            border-radius: 25px;
            width: 130px;
            height: 40px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        #closeEdit:hover, #clooose:hover {
            background-color: #bd76ff; /* Darker */
        }
        #modal {
            display: none;
            transform: translate(-50%, -50%);
            background: #2e2e2e;
            padding: 20px;
            border: none;
            border-radius: 25px;
            width: 400px;
            height: auto;
            max-height: 60%;
            z-index: 1001;
            position: fixed;
            top: 50%;
            left: 50%;
            overflow-y: auto;
        }
    </style>
</head>
<body>
<div id="modalFunction">
    <div id="modalContentFunction">
        <h3>Выберите функцию</h3>
        <table border="1" width="100%">
            <thead id="grinch">
            <tr>
                <th>ID</th>
                <th>Имя функции</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="function : ${functions}" class="function-row"
                th:onclick="|selectFunction(this, '${function.id}', modalTarget)|">
                <td th:text="${function.getId()}"></td>
                <td th:text="${function.getName()}"></td>
            </tr>
            </tbody>
        </table>
        <button id="loadButton" onclick="loadFunction()">Загрузить</button>
        <button id="closeclose" onclick="closeFunctionList()">Закрыть</button>
    </div>
</div>
<div id="modalSave">
    <div id="modalContentSave">
        <form onsubmit="saveFunction(event)">
            <label for="funcName">Сохранение функции</label>
            <input type="text" name="funcName" placeholder="Введите название" id="funcName" required>
            <button type="submit">Cохранить</button>
        </form>
    </div>
    <button onclick="closeSave()" id="clooose">Закрыть</button>
</div>
<div id="modalEdit">
    <div id="modalEditContent">
        <form onsubmit="editFunc(event)">
            <label for="xValue">Изменение точки</label>
            <input type="number" name="xValue" placeholder="Какую точку" id="xValue" required>
            <label for="yValue"></label>
            <input type="number" name="yValue" id="yValue" placeholder="На что" required>
            <button type="submit">Cохранить</button>
        </form>
    </div>
    <button onclick="closeEdit()" id="closeEdit">Закрыть</button>
</div>
<div id="modalRemove">
    <div id="modalRemoveContent">
        <form onsubmit="removeFunc(event)">
            <label for="xToRemove">Удаление точки</label>
            <input type="number" name="xValue" id="xToRemove" placeholder="Какую точку" required>
            <button type="submit">Cохранить</button>
        </form>
    </div>
    <button onclick="closeRemove()" id="ccclose">Закрыть</button>
</div>
<div id="modalOverlay" class="modal-overlay"></div>
</body>
</html>
